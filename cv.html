<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Ola Ozernov-Palchik, Ph.D.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #1a3a5c;
            --accent: #c41230;
            --text: #333;
            --light: #f7f8fa;
            --border: #e0e4e8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.7;
            color: var(--text);
            background: #fff;
        }
        nav {
            background: var(--primary);
            padding: 14px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 18px;
            font-size: 0.95em;
            letter-spacing: 0.3px;
            transition: opacity 0.2s;
        }
        nav a:hover { opacity: 0.8; }
        nav a.active { border-bottom: 2px solid #fff; padding-bottom: 2px; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        h1 {
            color: var(--primary);
            font-size: 1.8em;
            margin-bottom: 12px;
        }
        p { font-size: 0.95em; margin-bottom: 16px; }
        .download-btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 10px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95em;
            margin-bottom: 24px;
            transition: opacity 0.2s;
        }
        .download-btn:hover { opacity: 0.85; }
        iframe {
            width: 100%;
            height: 85vh;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        footer {
            background: var(--primary);
            color: rgba(255,255,255,0.7);
            text-align: center;
            padding: 24px;
            font-size: 0.85em;
        }
        footer a { color: rgba(255,255,255,0.9); text-decoration: none; }
        @media (max-width: 600px) {
            nav a { margin: 0 8px; font-size: 0.85em; }
            .container { padding: 24px 16px; }
        }
    </style>
</head>
<body>

    </div>

    <footer>

    </footer>
